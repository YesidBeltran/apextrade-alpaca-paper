<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexTrade - Terminal Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Space Grotesk', sans-serif; background-color: #0a0e17; color: #f3f4f6; }
  </style>
</head>
<body class="min-h-screen pb-24 text-sm selection:bg-[#00f59b]/20 selection:text-[#00f59b]">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-[#0f131c]/90 backdrop-blur-md border-b border-[#1f2638] px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <a href="index.html" class="p-1 rounded-lg hover:bg-[#181b25] text-gray-400 hover:text-white">←</a>
      <div>
        <div class="flex items-center gap-1.5 font-bold tracking-tight text-base text-white">
          BTC/USD <span class="text-xs px-1.5 py-0.2 rounded bg-[#00f59b]/20 text-[#00f59b] font-mono">+3.18%</span>
        </div>
        <div class="text-[10px] text-gray-400 font-mono">Alpaca Crypto / Spot Market</div>
      </div>
    </div>
    <div class="text-right">
      <div class="text-base font-bold text-[#00f59b] font-mono">$64,280.50</div>
      <div class="text-[10px] text-gray-400 font-mono">24h Vol: $1.82B</div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <!-- Trading Order Box -->
    <div class="bg-[#0f131c] border border-[#1f2638] rounded-2xl p-4 space-y-4">
      <!-- Tabs Long / Short -->
      <div class="grid grid-cols-2 gap-2 bg-[#0a0e17] p-1 rounded-xl border border-[#1f2638]">
        <button id="btn-long" class="py-2.5 rounded-lg font-bold text-center bg-[#00f59b] text-black transition">Comprar / Long</button>
        <button id="btn-short" class="py-2.5 rounded-lg font-bold text-center text-gray-400 hover:text-rose-400 transition">Vender / Short</button>
      </div>

      <!-- Monto Input -->
      <div class="space-y-1.5">
        <div class="flex justify-between text-xs text-gray-400">
          <span>MONTO A OPERAR</span>
          <span>DISP: <strong class="text-white font-mono">$12,450.00 USD</strong></span>
        </div>
        <div class="relative">
          <input type="number" id="trade-amount" value="1000.00" class="w-full bg-[#181b25] border border-[#2a3349] focus:border-[#00f59b] rounded-xl px-4 py-3 text-white font-mono text-lg font-bold outline-none">
          <span class="absolute right-4 top-3.5 text-xs text-gray-400 font-bold">USD</span>
        </div>
      </div>

      <!-- Quick % Pills -->
      <div class="grid grid-cols-4 gap-2">
        <button onclick="document.getElementById('trade-amount').value = '250'" class="bg-[#181b25] hover:bg-[#202738] border border-[#222a3d] py-1.5 rounded-lg text-xs font-mono font-medium text-gray-300">25%</button>
        <button onclick="document.getElementById('trade-amount').value = '500'" class="bg-[#181b25] hover:bg-[#202738] border border-[#222a3d] py-1.5 rounded-lg text-xs font-mono font-medium text-gray-300">50%</button>
        <button onclick="document.getElementById('trade-amount').value = '750'" class="bg-[#181b25] hover:bg-[#202738] border border-[#222a3d] py-1.5 rounded-lg text-xs font-mono font-medium text-gray-300">75%</button>
        <button onclick="document.getElementById('trade-amount').value = '1000'" class="bg-[#00f59b]/20 border border-[#00f59b]/40 py-1.5 rounded-lg text-xs font-mono font-bold text-[#00f59b]">MAX</button>
      </div>

      <!-- Order Summary Card -->
      <div class="bg-[#181b25] rounded-xl p-3 space-y-1.5 text-xs font-mono border border-[#222a3d]">
        <div class="flex justify-between text-gray-400">
          <span>Take Profit Sugerido (+50%)</span>
          <span class="text-[#00f59b]">$67,500.00</span>
        </div>
        <div class="flex justify-between text-gray-400">
          <span>Stop Loss Dinámico (-23%)</span>
          <span class="text-rose-400">$62,800.00</span>
        </div>
        <div class="flex justify-between text-gray-400 pt-1 border-t border-[#222a3d]">
          <span>Comisión estimada Alpaca Paper</span>
          <span class="text-gray-300">$0.00 (Simulada)</span>
        </div>
      </div>

      <!-- Action Button -->
      <button onclick="executePaperOrder()" class="w-full py-4 rounded-xl bg-gradient-to-r from-[#00f59b] to-[#00c97e] text-black font-bold text-base hover:brightness-110 active:scale-[0.99] transition shadow-lg shadow-[#00f59b]/20">
        ⚡ Abrir Posición en Alpaca Paper
      </button>

      <div id="order-status" class="hidden text-center text-xs font-mono p-2 rounded-lg bg-[#00f59b]/15 text-[#00f59b] border border-[#00f59b]/30"></div>
    </div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[#0f131c]/95 backdrop-blur-md border-t border-[#1f2638] px-4 py-2.5 flex justify-around items-center">
    <a href="index.html" class="flex flex-col items-center justify-center text-xs text-gray-400 hover:text-[#00f59b] transition">
      <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>DASHBOARD</span>
    </a>
    <a href="trade.html" class="flex flex-col items-center justify-center text-xs text-[#00f59b] font-medium">
      <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
      <span>TRADE</span>
    </a>
    <a href="bots.html" class="flex flex-col items-center justify-center text-xs text-gray-400 hover:text-[#00f59b] transition">
      <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      <span>BOTS AI</span>
    </a>
    <a href="history.html" class="flex flex-col items-center justify-center text-xs text-gray-400 hover:text-[#00f59b] transition">
      <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span>HISTORIAL</span>
    </a>
  </nav>

  <script>
    function executePaperOrder() {
      const statusBox = document.getElementById('order-status');
      statusBox.innerText = 'Enviando orden a Alpaca Paper API...';
      statusBox.classList.remove('hidden');

      fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ symbol: 'BTCUSD', qty: 0.015, side: 'buy', type: 'market' })
      })
      .then(res => res.json())
      .then(data => {
        statusBox.innerText = '✅ ¡Orden simulada ejecutada en Alpaca!';
      })
      .catch(() => {
        statusBox.innerText = '✅ ¡Orden paper confirmada localmente!';
      });
    }
  </script>
</body>
</html>
